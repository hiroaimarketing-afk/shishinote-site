<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">飲食店サイトのファーストビュー例</title>
  <desc id="desc">メニュー、写真、アクセス、予約導線を整理した飲食店サイトのデモ画面</desc>
  <defs>
    <linearGradient id="foodBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ddeee7"/>
    </linearGradient>
    <linearGradient id="foodPhoto" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f26b4f"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#foodBg)"/>
  <rect x="60" y="50" width="1080" height="76" rx="24" fill="#ffffff" opacity=".9"/>
  <text x="92" y="98" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="28" font-weight="900" fill="#111827">BISTRO SHISHI</text>
  <text x="710" y="96" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#4b5563">メニュー</text>
  <text x="830" y="96" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#4b5563">席・貸切</text>
  <text x="950" y="96" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="700" fill="#4b5563">アクセス</text>
  <rect x="1048" y="68" width="68" height="40" rx="20" fill="#256d5a"/>
  <text x="1066" y="94" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="16" font-weight="900" fill="#ffffff">予約</text>

  <g transform="translate(76 184)">
    <rect width="164" height="38" rx="19" fill="#ffffff"/>
    <text x="22" y="26" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="16" font-weight="900" fill="#256d5a">宴会予約受付中</text>
    <text x="0" y="118" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="66" font-weight="950" fill="#111827">写真で伝わる、</text>
    <text x="0" y="196" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="66" font-weight="950" fill="#111827">迷わず予約できる店。</text>
    <text x="0" y="254" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#374151">料理写真、メニュー、席、アクセスをスマホで確認しやすく。</text>
    <text x="0" y="294" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="24" font-weight="700" fill="#374151">GoogleマップやSNSからの来店導線を整えます。</text>
    <rect x="0" y="340" width="170" height="56" rx="28" fill="#256d5a"/>
    <text x="42" y="375" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="20" font-weight="900" fill="#ffffff">席を予約</text>
    <rect x="192" y="340" width="174" height="56" rx="28" fill="#ffffff" stroke="#d8dee8"/>
    <text x="229" y="375" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="20" font-weight="900" fill="#111827">メニュー</text>
  </g>

  <g transform="translate(738 172)">
    <rect x="0" y="0" width="360" height="360" rx="58" fill="url(#foodPhoto)"/>
    <circle cx="184" cy="166" r="102" fill="#fff7ed" opacity=".32"/>
    <circle cx="248" cy="96" r="34" fill="#ffffff" opacity=".3"/>
    <rect x="68" y="282" width="224" height="30" rx="15" fill="#ffffff" opacity=".42"/>
  </g>
  <g transform="translate(82 604)">
    <rect width="316" height="96" rx="22" fill="#ffffff"/>
    <text x="26" y="39" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="800" fill="#256d5a">見られる情報</text>
    <text x="26" y="70" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22" font-weight="900" fill="#111827">メニュー・席・写真</text>
  </g>
  <g transform="translate(432 604)">
    <rect width="316" height="96" rx="22" fill="#ffffff"/>
    <text x="26" y="39" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="800" fill="#256d5a">予約導線</text>
    <text x="26" y="70" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22" font-weight="900" fill="#111827">電話/予約サイト</text>
  </g>
  <g transform="translate(782 604)">
    <rect width="316" height="96" rx="22" fill="#ffffff"/>
    <text x="26" y="39" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="800" fill="#256d5a">来店導線</text>
    <text x="26" y="70" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22" font-weight="900" fill="#111827">Googleマップ連携</text>
  </g>
</svg>
