const BeforeAfterCard = ({ before, after, title, desc }) => {
  const [pos, setPos] = React.useState(50);
  const ref = React.useRef(null);
  const dragging = React.useRef(false);

  const move = (clientX) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    setPos((x / rect.width) * 100);
  };

  const onDown = (e) => {
    dragging.current = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    move(clientX);
  };
  const onMove = (e) => {
    if (!dragging.current) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    move(clientX);
  };
  const onUp = () => { dragging.current = false; };

  React.useEffect(() => {
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  }, []);

  return (
    <div className="ba-card">
      <div
        className="ba-frame"
        ref={ref}
        style={{ "--pos": pos + "%" }}
        onMouseDown={onDown}
        onTouchStart={onDown}
      >
        <img className="after" src={after} alt="" />
        <img className="before" src={before} alt="" />
        <span className="tag before-tag">BEFORE</span>
        <span className="tag after-tag">AFTER</span>
        <div className="handle"></div>
      </div>
      <div className="ba-meta">
        <h4>{title}</h4>
        <p>{desc}</p>
      </div>
    </div>
  );
};

const DiagnosticTool = () => {
  const [step, setStep] = React.useState(0);
  const [answers, setAnswers] = React.useState([]);
  const total = DIAG_QUESTIONS.length;
  const done = step >= total;

  const select = (idx) => {
    const next = [...answers];
    next[step] = idx;
    setAnswers(next);
    setTimeout(() => setStep(step + 1), 200);
  };

  const reset = () => { setStep(0); setAnswers([]); };

  const resultPlan = React.useMemo(() => {
    if (!done) return null;
    const score = { mini: 0, std: 0, prem: 0 };
    answers.forEach((a, i) => {
      const opt = DIAG_QUESTIONS[i]?.options[a];
      if (!opt) return;
      score.mini += opt.score.mini;
      score.std += opt.score.std;
      score.prem += opt.score.prem;
    });
    const best = Object.entries(score).sort((a, b) => b[1] - a[1])[0][0];
    return PLAN_INFO[best];
  }, [done, answers]);

  return (
    <section className="section diagnostic" id="diagnose">
      <Container>
        <div>
          <Eyebrow>FREE DIAGNOSIS</Eyebrow>
          <h2 className="section-title" style={{ color: "#fff" }}>
            <span style={{ color: "var(--gold)" }}>30秒</span>でわかる、<br/>
            あなたのお店に最適な<br/>
            <span style={{ background: "linear-gradient(180deg, transparent 62%, rgba(247,183,51,.5) 62%)", padding: "0 4px" }}>プランと概算費用</span>
          </h2>
          <p style={{ color: "rgba(255,255,255,.78)", fontSize: 16, lineHeight: 1.9, fontWeight: 700, marginTop: 18 }}>
            業種・規模・目的を5つの質問でお聞きするだけ。匿名でもご利用いただけます。<br/>
            お見積もりはあくまで目安。正式な金額は無料相談でお出しします。
          </p>
          <div style={{ marginTop: 28, display: "flex", gap: 16, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, fontWeight: 800 }}>
              <span style={{ width: 28, height: 28, borderRadius: "50%", background: "var(--gold)", color: "var(--ink)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                <Icon.check width="16" height="16" />
              </span>
              入力情報の保存なし
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 14, fontWeight: 800 }}>
              <span style={{ width: 28, height: 28, borderRadius: "50%", background: "var(--gold)", color: "var(--ink)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                <Icon.check width="16" height="16" />
              </span>
              連絡先入力は任意
            </div>
          </div>
        </div>

        <div className="diagnostic-card">
          <div className="diag-progress">
            {Array.from({ length: total }).map((_, i) => (
              <span key={i} className={i < step ? "done" : i === step ? "active" : ""}></span>
            ))}
          </div>
          {!done ? (
            <div className="diag-q">
              <span className="step-label">Question {step + 1} / {total}</span>
              <h3>{DIAG_QUESTIONS[step].q}</h3>
              <div className="diag-options">
                {DIAG_QUESTIONS[step].options.map((opt, i) => (
                  <button
                    key={i}
                    className={`diag-option${answers[step] === i ? " selected" : ""}`}
                    type="button"
                    onClick={() => select(i)}
                  >
                    <span className="bullet"></span>
                    <span>{opt.label}</span>
                  </button>
                ))}
              </div>
              <div className="diag-actions">
                {step > 0 && (
                  <button type="button" className="ghost" onClick={() => setStep(step - 1)}>← 前に戻る</button>
                )}
              </div>
            </div>
          ) : (
            <div className="diag-result">
              <span className="badge">{resultPlan.badge}</span>
              <h3 className="plan-name">{resultPlan.name}</h3>
              <p className="price">{resultPlan.price}</p>
              <ul>
                {resultPlan.items.map((it, i) => <li key={i}>{it}</li>)}

              <div style={{ display: "flex", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
                <Button variant="primary" href="#contact">このプランで相談する →</Button>
                <button type="button" className="ghost" onClick={reset}>もう一度診断する</button>
              </div>
            </div>
          )}
        </div>
      </Container>
    </section>
  );
};

        <FAQItem q="無料デモサイトとは何ですか？" a="ご相談前に、業種・店舗名・特徴をお伝えいただければ、シシノテで1ページのデモサイトを無料で制作します。契約義務はなく、気に入らなければ破棄でOKです。" />
        <FAQItem q="公開までどれくらいかかりますか？" a="LP1枚で2〜3週間、3〜5ページの基本サイトで4〜6週間が目安です。素材の準備状況や修正のラリーによって前後しますが、シシノテ側で巻き取れる作業が多いので、店舗側の負担は少なく進められます。" />
        <FAQItem q="修正回数に上限はありますか？" a="プランごとに目安の回数を事前にご案内します。回数を超える大幅な修正や、構成自体の変更が必要な場合は、別途お見積もりとなることがあります。ご了承いただいた範囲を超える追加請求は行いません。" />

        <FAQItem q="公開後の更新は誰が行いますか？" a="月額保守プラン（5,000円〜）でシシノテが対応、または操作レクチャー込みで店舗様ご自身で更新、どちらも選べます。プランは解約自由です。" />

// CONTACT
// ========================================================================
const ContactForm = () => {
  const [busy, setBusy] = React.useState(false);
  const [status, setStatus] = React.useState({ state: "", msg: "" });

  const submit = async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const formData = new FormData(form);
    const email = String(formData.get("email") || "").trim();
    const emailConfirm = String(formData.get("emailConfirm") || "").trim();
    const topic = String(formData.get("topic") || "").trim();
    const freeMessage = String(formData.get("messageBody") || "").trim();

    if (email !== emailConfirm) {
      setStatus({ state: "error", msg: "メールアドレスが一致していません。確認用メールアドレスを見直してください。" });
      return;
    }

    const payload = {
      organization: String(formData.get("organization") || "").trim(),
      name: String(formData.get("name") || "").trim(),
      email,
      emailConfirm,
      phone: String(formData.get("phone") || "").trim(),
      websiteUrl: String(formData.get("websiteUrl") || "").trim(),
      message: [
        topic && `ご希望のご相談内容: ${topic}`,
        freeMessage && `詳細:\n${freeMessage}`
      ].filter(Boolean).join("\n\n")
    };

    setBusy(true);
    setStatus({ state: "", msg: "送信中です。少しだけお待ちください。" });

    try {
      const response = await fetch(new URL("/api/contact", window.location.href).href, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || "送信に失敗しました。時間をおいて再度お試しください。");
      }

      form.reset();
      window.location.assign("thanks.html");
    } catch (error) {
      setStatus({
        state: "error",
        msg: error instanceof Error ? error.message : "送信に失敗しました。時間をおいて再度お試しください。"
      });
    } finally {
      setBusy(false);
    }
  };

  return (
    <section className="section contact" id="contact">
      <Container className="contact-layout">
        <div>
          <Eyebrow>FREE CONSULTATION</Eyebrow>
          <h2 className="section-title">
            まずは<span style={{ background: "linear-gradient(180deg, transparent 60%, rgba(247,183,51,.4) 60%)", padding: "0 4px" }}>30秒</span>の<br/>
            無料相談から。
          </h2>
          <p style={{ marginTop: 22 }}>
            店舗名、業種、作りたいページ、写真や原稿の準備状況をお聞きします。<br/>
            必要な範囲と概算費用を整理してお返しします。営業電話は一切ありません。
          </p>
          <ul className="contact-perks" style={{ margin: 0, padding: 0, listStyle: "none" }}>
            <li>原則1〜2営業日以内にご返信</li>
            <li>無料デモサイト制作（希望時）</li>
            <li>その場で概算費用がわかる簡単見積もりつき</li>
            <li>断りやすい・営業電話なし</li>
          </ul>
        </div>
        <form className="contact-form" onSubmit={submit}>
          <input type="text" name="_gotcha" tabIndex="-1" autoComplete="off" aria-hidden="true" hidden />
          <label>
            <span className="field-label">店舗名・法人名</span>
            <span className="field-required">必須</span>
            <input type="text" name="organization" autoComplete="organization" required />
          </label>
          <label>
            <span className="field-label">お名前</span>
            <span className="field-required">必須</span>
            <input type="text" name="name" autoComplete="name" required />
          </label>
          <label>
            <span className="field-label">メールアドレス</span>
            <span className="field-required">必須</span>
            <input type="email" name="email" autoComplete="email" inputMode="email" required />
          </label>
          <label>
            <span className="field-label">メールアドレス確認</span>
            <span className="field-required">必須</span>
            <input type="email" name="emailConfirm" autoComplete="email" inputMode="email" required />
          </label>
          <label>
            <span className="field-label">電話番号</span>
            <input type="tel" name="phone" autoComplete="tel" inputMode="tel" />
          </label>
          <label>
            <span className="field-label">既存WEBサイト・SNSのURL等</span>
            <input type="url" name="websiteUrl" placeholder="https://" inputMode="url" />
          </label>
          <label>
            <span className="field-label">ご希望のご相談内容</span>
            <select name="topic">
              <option>無料デモサイトを依頼したい</option>
              <option>料金プランの相談</option>
              <option>既存サイトの刷新</option>
              <option>新規開業に向けた制作</option>
              <option>その他</option>
            </select>
          </label>
          <label>
            <span className="field-label">ご相談内容（任意）</span>
            <textarea name="messageBody" rows="4" placeholder="業種・店舗エリア・現状のWeb有無など、わかる範囲でお書きください。" />
          </label>
          <p className="form-status" data-state={status.state} aria-live="polite">{status.msg}</p>
          <Button type="submit" variant="primary" full disabled={busy}>
            {busy ? "送信中..." : "1営業日以内に返信を受け取る →"}
          </Button>
          <p style={{ margin: 0, fontSize: 11, color: "var(--muted)", fontWeight: 700, textAlign: "center" }}>
            送信いただいた情報は、ご相談対応のみに利用します。
          </p>
        </form>
      </Container>
    </section>
  );
};
